# Nexio has no Swift package dependencies, so the only moving parts are the
# GitHub Actions used by the workflows. Weekly grouped PRs keep them current.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
