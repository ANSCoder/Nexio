name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── iOS ────────────────────────────────────────────────────────────────────
  ios:
    name: iOS ${{ matrix.ios }} / Xcode ${{ matrix.xcode }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - xcode: "27.1"
            ios: "27.0"
            simulator: "iPhone 18 Pro"

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
          xcodebuild -version

      - name: Boot simulator
        # Boot explicitly and wait. Otherwise xcodebuild can start the test runner
        # before the simulator is ready, and the runner hangs until the job times out.
        run: |
          xcrun simctl bootstatus "${{ matrix.simulator }}" -b

      - name: Build & Test (iOS)
        # pipefail is not set by default, so a failing test would be hidden by a pipe.
        # xcpretty is dropped for the same reason: a missing tool fails the job.
        # Parallel testing is off and each test has a time limit, so a hang fails in
        # minutes instead of holding the job for the full timeout.
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Nexio \
            -destination "platform=iOS Simulator,name=${{ matrix.simulator }},OS=${{ matrix.ios }}" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 300 \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

  # ── macOS ──────────────────────────────────────────────────────────────────
  macos:
    name: macOS / Swift Package
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Build
        run: swift build -c release

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Generate coverage report
        run: |
          set -euo pipefail
          test_binary=$(find .build -type f \
            -path '*/NexioTests.xctest/Contents/MacOS/NexioTests' \
            -print -quit)
          profile=$(find .build -type f \
            -path '*/codecov/default.profdata' \
            -print -quit)
          if [ -z "$test_binary" ]; then
            echo "Could not find the NexioTests executable under .build." >&2
            exit 1
          fi
          if [ -z "$profile" ]; then
            echo "Could not find the Swift code coverage profile under .build." >&2
            exit 1
          fi
          xcrun llvm-cov export \
            "$test_binary" \
            -instr-profile "$profile" \
            -ignore-filename-regex ".build|Tests" \
            -format lcov > coverage.lcov
          test -s coverage.lcov   # fail if the export produced nothing

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          fail_ci_if_error: false

  # ── Swift 6 strict concurrency ────────────────────────────────────────────
  swift6:
    name: Swift 6 strict concurrency check
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Build library and tests with strict concurrency
        # --build-tests compiles the test target too, so concurrency errors in tests fail CI.
        run: |
          swift build --build-tests \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors
