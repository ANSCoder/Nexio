name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── iOS ────────────────────────────────────────────────────────────────────
  ios:
    name: iOS ${{ matrix.ios }} / Xcode ${{ matrix.xcode }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - xcode: "27.1"
            ios: "27.0"
            simulator: "iPhone 18 Pro"

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
          xcodebuild -version

      - name: Build & Test (iOS)
        # pipefail is not set by default, so a failing test would be hidden by a pipe.
        # xcpretty is dropped for the same reason: a missing tool fails the job.
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Nexio \
            -destination "platform=iOS Simulator,name=${{ matrix.simulator }},OS=${{ matrix.ios }}" \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

  # ── macOS ──────────────────────────────────────────────────────────────────
  macos:
    name: macOS / Swift Package
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Build
        run: swift build -c release

      - name: Test with coverage
        run: swift test --enable-code-coverage

      - name: Generate coverage report
        run: |
          xcrun llvm-cov export \
            .build/debug/NexioPackageTests.xctest/Contents/MacOS/NexioPackageTests \
            -instr-profile .build/debug/codecov/default.profdata \
            -ignore-filename-regex ".build|Tests" \
            -format lcov > coverage.lcov
          test -s coverage.lcov   # fail if the export produced nothing

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          fail_ci_if_error: false

  # ── Swift 6 strict concurrency ────────────────────────────────────────────
  swift6:
    name: Swift 6 strict concurrency check
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Build library and tests with strict concurrency
        # --build-tests compiles the test target too, so concurrency errors in tests fail CI.
        run: |
          swift build --build-tests \
            -Xswiftc -strict-concurrency=complete \
            -Xswiftc -warnings-as-errors
