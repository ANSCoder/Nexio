name: Danger

on:
  pull_request:
    branches: [main]

jobs:
  danger:
    name: Danger Swift
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      issues: write
      statuses: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Danger
        uses: danger/swift@3.22.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
